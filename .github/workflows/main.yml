# .github/workflows/main.yml (或者 ci-cd.yml)

name: Build, Test, Push, and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码到工作区
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 后端 CI ---

      # 2. 设置 JDK 1.8 环境
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3. 后端构建 (指定了正确的工作目录)
      - name: Build Backend (Skipping Tests)
        # 关键修改：告诉此步骤，所有命令都在 ./backend 目录内执行
        working-directory: ./airline-order-manage/backend
        run: mvn -B package -DskipTests --file pom.xml

      # --- 前端 CI ---

      # 4. 设置 Node.js 环境
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 5. 前端构建 (指定了正确的工作目录)
      - name: Build Frontend
        # 关键修改：告诉此步骤，所有命令都在 ./frontend 目录内执行
        working-directory: ./airline-order-manage/frontend
        run: npm ci && npm run build

      # --- Docker 构建与部署 (CD) ---

      # 6. 登录到 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. 构建并推送 Docker 镜像
      #    注意：你的 Dockerfile 也需要正确地引用 backend/target 和 frontend/dist 里的产物
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          # context 仍然是项目根目录，这样 Dockerfile 可以访问到 backend 和 frontend 文件夹
          context: .
          # Dockerfile 的路径，假设它在根目录
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-order-manage:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-order-manage:${{ github.sha }}

      # 8. 部署到 EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/my-app-deployment
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f