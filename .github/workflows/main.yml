# .github/workflows/main.yml

name: Build, Test, Push, and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # (可选但推荐) 添加一个调试步骤来确认目录结构
      - name: Verify Directory Structure
        run: ls -R

      # --- 后端 CI ---

      # 2. 设置 JDK 1.8 环境
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3. 后端构建 (使用正确的、直接的相对路径)
      - name: Build Backend (Skipping Tests)
        # 关键修复：直接指向 backend 子目录
        working-directory: ./backend
        run: mvn -B package -DskipTests --file pom.xml

      # --- 前端 CI ---

      # 4. 设置 Node.js 环境
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 5. 前端构建 (使用正确的、直接的相对路径)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          # 你可以指定 pnpm 的版本，或者让它使用最新的
          version: 8

      # 6. 安装前端依赖 (使用 pnpm)
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        # 现在我们使用 pnpm install，它会自动读取 pnpm-lock.yaml
        run: pnpm install

      # 7. 构建前端 (使用 pnpm)
      - name: Build Frontend
        working-directory: ./frontend
        run: pnpm run build

      # --- Docker 构建与部署 (CD) ---
      # (后面的步骤保持不变)

      # 6. 登录到 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. 构建并推送 Docker 镜像
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-order-manage:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-order-manage:${{ github.sha }}

      # 8. 部署到 EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/airline-cicd
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f